<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" width="100%" role="img" aria-label="One request carries the main sync plus optional riders for other spreadsheets and housekeeping; each rider is handled separately so a failure in one does not stop the sync.">
<style>.fig{font-family:var(--font-body,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif)}
.fig .t{font-size:14px;font-weight:600;fill:var(--tx,#26232e)}
.fig .s{font-size:12px;fill:var(--tx-2,#6f687c)}
.fig .b rect{fill:color-mix(in srgb,var(--c) 11%,var(--bg,#fffcf7));stroke:var(--c);stroke-width:1}
.fig .lav{--c:var(--lav,#6d5ae6)}
.fig .mint{--c:var(--mint,#1d9e76)}
.fig .coral{--c:var(--coral,#d94f3b)}
.fig .plain rect{fill:var(--bg-soft,#f5f0e8);stroke:color-mix(in srgb,var(--tx-2,#6f687c) 40%,var(--bg,#fffcf7))}
.fig .a{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5}
.fig .f{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:.75;stroke-dasharray:4 4;opacity:.7}
.fig marker path{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="fig-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9"/></marker></defs>
<g class="b lav"><rect x="60" y="40" width="560" height="56" rx="8"/><text class="t" x="340" y="59" text-anchor="middle" dominant-baseline="central">One request from the device</text><text class="s" x="340" y="78" text-anchor="middle" dominant-baseline="central">secret · version · since, plus whichever riders are needed this time</text></g>
<line class="a" x1="106" y1="98" x2="106" y2="146" marker-end="url(#fig-arrow)"/>
<line class="a" x1="262" y1="98" x2="262" y2="146" marker-end="url(#fig-arrow)"/>
<line class="a" x1="418" y1="98" x2="418" y2="146" marker-end="url(#fig-arrow)"/>
<line class="a" x1="574" y1="98" x2="574" y2="146" marker-end="url(#fig-arrow)"/>
<g class="b mint"><rect x="40" y="150" width="132" height="56" rx="8"/><text class="t" x="106" y="169" text-anchor="middle" dominant-baseline="central">push · pull</text><text class="s" x="106" y="188" text-anchor="middle" dominant-baseline="central">Main sheet rows</text></g>
<g class="b mint"><rect x="196" y="150" width="132" height="56" rx="8"/><text class="t" x="262" y="169" text-anchor="middle" dominant-baseline="central">reading</text><text class="s" x="262" y="188" text-anchor="middle" dominant-baseline="central">Another sheet</text></g>
<g class="b mint"><rect x="352" y="150" width="132" height="56" rx="8"/><text class="t" x="418" y="169" text-anchor="middle" dominant-baseline="central">tidy · archive</text><text class="s" x="418" y="188" text-anchor="middle" dominant-baseline="central">Housekeeping</text></g>
<g class="b mint"><rect x="508" y="150" width="132" height="56" rx="8"/><text class="t" x="574" y="169" text-anchor="middle" dominant-baseline="central">quarter</text><text class="s" x="574" y="188" text-anchor="middle" dominant-baseline="central">Its own request</text></g>
<g class="b plain"><rect x="60" y="260" width="560" height="56" rx="8"/><text class="t" x="340" y="279" text-anchor="middle" dominant-baseline="central">Each rider is wrapped on its own</text><text class="s" x="340" y="298" text-anchor="middle" dominant-baseline="central">A broken Reading or Quarter sheet reports its error; the main sync still completes</text></g>
</svg>
