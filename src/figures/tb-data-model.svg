<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 522" width="100%" role="img" aria-label="The data model in the sheet: visible tabs for plans, items, tasks, contacts and coffee chats; hidden tabs for the daily log, settings and deletions.">
<style>.fig{font-family:var(--font-body,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif)}
.fig .t{font-size:14px;font-weight:600;fill:var(--tx,#26232e)}
.fig .s{font-size:12px;fill:var(--tx-2,#6f687c)}
.fig .b rect{fill:color-mix(in srgb,var(--c) 11%,var(--bg,#fffcf7));stroke:var(--c);stroke-width:1}
.fig .lav{--c:var(--lav,#6d5ae6)}
.fig .mint{--c:var(--mint,#1d9e76)}
.fig .coral{--c:var(--coral,#d94f3b)}
.fig .plain rect{fill:var(--bg-soft,#f5f0e8);stroke:color-mix(in srgb,var(--tx-2,#6f687c) 40%,var(--bg,#fffcf7))}
.fig .a{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5}
.fig .f{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:.75;stroke-dasharray:4 4;opacity:.7}
.fig marker path{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="fig-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9"/></marker></defs>
<rect class="f" x="40" y="30" width="600" height="216" rx="12"/>
<text class="t" x="60" y="52" text-anchor="start" dominant-baseline="central">Tabs you normally see</text>
<g class="b mint"><rect x="60" y="70" width="156" height="56" rx="8"/><text class="t" x="138" y="89" text-anchor="middle" dominant-baseline="central">Projects</text><text class="s" x="138" y="108" text-anchor="middle" dominant-baseline="central">One row per plan</text></g>
<line class="a" x1="218" y1="98" x2="258" y2="98" marker-end="url(#fig-arrow)"/>
<g class="b mint"><rect x="262" y="70" width="156" height="56" rx="8"/><text class="t" x="340" y="89" text-anchor="middle" dominant-baseline="central">Items</text><text class="s" x="340" y="108" text-anchor="middle" dominant-baseline="central">Pieces of a plan</text></g>
<line class="a" x1="420" y1="98" x2="460" y2="98" marker-end="url(#fig-arrow)"/>
<g class="b mint"><rect x="464" y="70" width="156" height="56" rx="8"/><text class="t" x="542" y="89" text-anchor="middle" dominant-baseline="central">Tasks</text><text class="s" x="542" y="108" text-anchor="middle" dominant-baseline="central">Things on a given day</text></g>
<g class="b mint"><rect x="60" y="170" width="156" height="56" rx="8"/><text class="t" x="138" y="189" text-anchor="middle" dominant-baseline="central">Archive</text><text class="s" x="138" y="208" text-anchor="middle" dominant-baseline="central">Old tasks moved out</text></g>
<g class="b mint"><rect x="262" y="170" width="156" height="56" rx="8"/><text class="t" x="340" y="189" text-anchor="middle" dominant-baseline="central">Contacts</text><text class="s" x="340" y="208" text-anchor="middle" dominant-baseline="central">One row per person</text></g>
<line class="a" x1="420" y1="198" x2="460" y2="198" marker-end="url(#fig-arrow)"/>
<g class="b mint"><rect x="464" y="170" width="156" height="56" rx="8"/><text class="t" x="542" y="189" text-anchor="middle" dominant-baseline="central">Coffee chats</text><text class="s" x="542" y="208" text-anchor="middle" dominant-baseline="central">One row per chat</text></g>
<line class="a" x1="542" y1="128" x2="542" y2="166" marker-end="url(#fig-arrow)"/>
<rect class="f" x="40" y="266" width="600" height="236" rx="12"/>
<text class="t" x="60" y="288" text-anchor="start" dominant-baseline="central">Hidden tabs</text><text class="s" x="158" y="288" text-anchor="start" dominant-baseline="central">right-click a tab to show them</text>
<g class="b plain"><rect x="60" y="306" width="156" height="56" rx="8"/><text class="t" x="138" y="325" text-anchor="middle" dominant-baseline="central">Log</text><text class="s" x="138" y="344" text-anchor="middle" dominant-baseline="central">One row per day</text></g>
<g class="b plain"><rect x="262" y="306" width="156" height="56" rx="8"/><text class="t" x="340" y="325" text-anchor="middle" dominant-baseline="central">Settings</text><text class="s" x="340" y="344" text-anchor="middle" dominant-baseline="central">One key, one JSON row</text></g>
<g class="b plain"><rect x="464" y="306" width="156" height="56" rx="8"/><text class="t" x="542" y="325" text-anchor="middle" dominant-baseline="central">Deleted</text><text class="s" x="542" y="344" text-anchor="middle" dominant-baseline="central">Tombstones, 14 days</text></g>
<line class="a" x1="340" y1="364" x2="340" y2="402" marker-end="url(#fig-arrow)"/>
<g class="b plain"><rect x="60" y="406" width="560" height="76" rx="8"/><text class="t" x="340" y="426" text-anchor="middle" dominant-baseline="central">Kept in Settings, one row each</text><text class="s" x="340" y="446" text-anchor="middle" dominant-baseline="central">goal: goals · idea: ideas · meal-ing: / meal-box: / meal-week: meals</text><text class="s" x="340" y="464" text-anchor="middle" dominant-baseline="central">groups · timer · capacity · prefs · reading · quarter</text></g>
</svg>
