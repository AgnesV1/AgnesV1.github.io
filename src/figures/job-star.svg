<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 346" width="100%" role="img" aria-label="The shape of an interview story: two sentences of situation, two of task and result, about three action steps each with the choice, the reason and the feedback, then a callback to the result. It shows that you saw the whole environment, knew your own part, and understand how the two shaped each other.">
<style>.fig{font-family:var(--font-body,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif)}
.fig .t{font-size:14px;font-weight:600;fill:var(--tx,#26232e)}
.fig .s{font-size:12px;fill:var(--tx-2,#6f687c)}
.fig .b rect{fill:color-mix(in srgb,var(--c) 11%,var(--bg,#fffcf7));stroke:var(--c);stroke-width:1}
.fig .lav{--c:var(--lav,#6d5ae6)}
.fig .mint{--c:var(--mint,#1d9e76)}
.fig .coral{--c:var(--coral,#d94f3b)}
.fig .plain rect{fill:var(--bg-soft,#f5f0e8);stroke:color-mix(in srgb,var(--tx-2,#6f687c) 40%,var(--bg,#fffcf7))}
.fig .a{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5}
.fig .f{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:.75;stroke-dasharray:4 4;opacity:.7}
.fig marker path{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="fig-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9"/></marker></defs>
<g class="b lav"><rect x="40" y="40" width="132" height="56" rx="8"/><text class="t" x="106" y="59" text-anchor="middle" dominant-baseline="central">Situation</text><text class="s" x="106" y="78" text-anchor="middle" dominant-baseline="central">The big picture</text></g>
<line class="a" x1="174" y1="68" x2="192" y2="68" marker-end="url(#fig-arrow)"/>
<g class="b lav"><rect x="196" y="40" width="132" height="56" rx="8"/><text class="t" x="262" y="59" text-anchor="middle" dominant-baseline="central">Task + result</text><text class="s" x="262" y="78" text-anchor="middle" dominant-baseline="central">Goal, and outcome</text></g>
<line class="a" x1="330" y1="68" x2="348" y2="68" marker-end="url(#fig-arrow)"/>
<g class="b lav"><rect x="352" y="40" width="132" height="56" rx="8"/><text class="t" x="418" y="59" text-anchor="middle" dominant-baseline="central">Action</text><text class="s" x="418" y="78" text-anchor="middle" dominant-baseline="central">About three steps</text></g>
<line class="a" x1="486" y1="68" x2="504" y2="68" marker-end="url(#fig-arrow)"/>
<g class="b lav"><rect x="508" y="40" width="132" height="56" rx="8"/><text class="t" x="574" y="59" text-anchor="middle" dominant-baseline="central">Callback</text><text class="s" x="574" y="78" text-anchor="middle" dominant-baseline="central">Result, once more</text></g>
<text class="s" x="106" y="112" text-anchor="middle" dominant-baseline="central">2 sentences</text>
<text class="s" x="262" y="112" text-anchor="middle" dominant-baseline="central">2 sentences</text>
<text class="s" x="574" y="112" text-anchor="middle" dominant-baseline="central">1 sentence + a small result</text>
<line class="a" x1="418" y1="98" x2="418" y2="146" marker-end="url(#fig-arrow)"/>
<g class="b plain"><rect x="60" y="150" width="560" height="56" rx="8"/><text class="t" x="340" y="169" text-anchor="middle" dominant-baseline="central">Each action step</text><text class="s" x="340" y="188" text-anchor="middle" dominant-baseline="central">The choice you made · why · roughly what came back</text></g>
<line class="a" x1="340" y1="208" x2="340" y2="246" marker-end="url(#fig-arrow)"/>
<g class="b mint"><rect x="60" y="250" width="560" height="76" rx="8"/><text class="t" x="340" y="270" text-anchor="middle" dominant-baseline="central">What it shows</text><text class="s" x="340" y="290" text-anchor="middle" dominant-baseline="central">You saw the whole environment, and you knew your own part</text><text class="s" x="340" y="308" text-anchor="middle" dominant-baseline="central">You know how your actions and the environment shaped each other</text></g>
</svg>
