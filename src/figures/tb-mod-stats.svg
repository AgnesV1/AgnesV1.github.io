<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 246" width="100%" role="img" aria-label="The stats module: timed work feeds two review pages. One shows where the hours went, with a heatmap of what you are usually doing at each hour and deep work shown apart. The other shows how the plans went, with how much got finished and the reasons things slipped.">
<style>.fig{font-family:var(--font-body,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif)}
.fig .t{font-size:14px;font-weight:600;fill:var(--tx,#26232e)}
.fig .s{font-size:12px;fill:var(--tx-2,#6f687c)}
.fig .b rect{fill:color-mix(in srgb,var(--c) 11%,var(--bg,#fffcf7));stroke:var(--c);stroke-width:1}
.fig .lav{--c:var(--lav,#6d5ae6)}
.fig .mint{--c:var(--mint,#1d9e76)}
.fig .coral{--c:var(--coral,#d94f3b)}
.fig .plain rect{fill:var(--bg-soft,#f5f0e8);stroke:color-mix(in srgb,var(--tx-2,#6f687c) 40%,var(--bg,#fffcf7))}
.fig .a{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5}
.fig .f{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:.75;stroke-dasharray:4 4;opacity:.7}
.fig marker path{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="fig-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9"/></marker></defs>
<g class="b lav"><rect x="60" y="40" width="560" height="56" rx="8"/><text class="t" x="340" y="59" text-anchor="middle" dominant-baseline="central">Timed work</text><text class="s" x="340" y="78" text-anchor="middle" dominant-baseline="central">Each stretch has a project, a start and an end, and may be marked deep</text></g>
<line class="a" x1="190" y1="98" x2="190" y2="146" marker-end="url(#fig-arrow)"/>
<line class="a" x1="490" y1="98" x2="490" y2="146" marker-end="url(#fig-arrow)"/>
<g class="b mint"><rect x="60" y="150" width="260" height="76" rx="8"/><text class="t" x="190" y="170" text-anchor="middle" dominant-baseline="central">Time: where the hours went</text><text class="s" x="190" y="190" text-anchor="middle" dominant-baseline="central">What you usually do at this hour</text><text class="s" x="190" y="208" text-anchor="middle" dominant-baseline="central">Deep work shown apart from the rest</text></g>
<g class="b mint"><rect x="360" y="150" width="260" height="76" rx="8"/><text class="t" x="490" y="170" text-anchor="middle" dominant-baseline="central">Plan: how the plans went</text><text class="s" x="490" y="190" text-anchor="middle" dominant-baseline="central">How much got finished</text><text class="s" x="490" y="208" text-anchor="middle" dominant-baseline="central">The reasons things slipped</text></g>
</svg>
