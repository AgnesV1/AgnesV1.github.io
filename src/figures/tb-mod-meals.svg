<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="100%" role="img" aria-label="The meal prep module has two separate lines. Groceries are combined into boxes, boxes are placed on days in the weeks ahead, and the shopping list is built from the plan and grouped by shop. Restock runs on a longer clock: things replaced every few months or years, each on its own cycle, listed by the month they come due.">
<style>.fig{font-family:var(--font-body,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif)}
.fig .t{font-size:14px;font-weight:600;fill:var(--tx,#26232e)}
.fig .s{font-size:12px;fill:var(--tx-2,#6f687c)}
.fig .b rect{fill:color-mix(in srgb,var(--c) 11%,var(--bg,#fffcf7));stroke:var(--c);stroke-width:1}
.fig .lav{--c:var(--lav,#6d5ae6)}
.fig .mint{--c:var(--mint,#1d9e76)}
.fig .coral{--c:var(--coral,#d94f3b)}
.fig .plain rect{fill:var(--bg-soft,#f5f0e8);stroke:color-mix(in srgb,var(--tx-2,#6f687c) 40%,var(--bg,#fffcf7))}
.fig .a{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5}
.fig .f{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:.75;stroke-dasharray:4 4;opacity:.7}
.fig marker path{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="fig-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9"/></marker></defs>
<g class="b lav"><rect x="40" y="40" width="132" height="56" rx="8"/><text class="t" x="106" y="59" text-anchor="middle" dominant-baseline="central">Groceries</text><text class="s" x="106" y="78" text-anchor="middle" dominant-baseline="central">Where, how long</text></g>
<line class="a" x1="174" y1="68" x2="192" y2="68" marker-end="url(#fig-arrow)"/>
<g class="b lav"><rect x="196" y="40" width="132" height="56" rx="8"/><text class="t" x="262" y="59" text-anchor="middle" dominant-baseline="central">Boxes</text><text class="s" x="262" y="78" text-anchor="middle" dominant-baseline="central">One meal each</text></g>
<line class="a" x1="330" y1="68" x2="348" y2="68" marker-end="url(#fig-arrow)"/>
<g class="b lav"><rect x="352" y="40" width="132" height="56" rx="8"/><text class="t" x="418" y="59" text-anchor="middle" dominant-baseline="central">Plan</text><text class="s" x="418" y="78" text-anchor="middle" dominant-baseline="central">Boxes onto days</text></g>
<line class="a" x1="486" y1="68" x2="504" y2="68" marker-end="url(#fig-arrow)"/>
<g class="b mint"><rect x="508" y="40" width="132" height="56" rx="8"/><text class="t" x="574" y="59" text-anchor="middle" dominant-baseline="central">Shopping list</text><text class="s" x="574" y="78" text-anchor="middle" dominant-baseline="central">Grouped by shop</text></g>
<text class="s" x="60" y="128" text-anchor="start" dominant-baseline="central">A separate line, on a longer clock</text>
<g class="b coral"><rect x="60" y="146" width="156" height="56" rx="8"/><text class="t" x="138" y="165" text-anchor="middle" dominant-baseline="central">Restock</text><text class="s" x="138" y="184" text-anchor="middle" dominant-baseline="central">Not food, not weekly</text></g>
<line class="a" x1="218" y1="174" x2="258" y2="174" marker-end="url(#fig-arrow)"/>
<g class="b coral"><rect x="262" y="146" width="156" height="56" rx="8"/><text class="t" x="340" y="165" text-anchor="middle" dominant-baseline="central">Its own cycle</text><text class="s" x="340" y="184" text-anchor="middle" dominant-baseline="central">Months, or years</text></g>
<line class="a" x1="420" y1="174" x2="460" y2="174" marker-end="url(#fig-arrow)"/>
<g class="b mint"><rect x="464" y="146" width="156" height="56" rx="8"/><text class="t" x="542" y="165" text-anchor="middle" dominant-baseline="central">Coming up</text><text class="s" x="542" y="184" text-anchor="middle" dominant-baseline="central">What is due, by month</text></g>
<text class="s" x="340" y="226" text-anchor="middle" dominant-baseline="central">Vitamins every few months; a digital watch every few years, when its battery life is up</text>
</svg>
