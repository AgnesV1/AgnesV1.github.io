<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" width="100%" role="img" aria-label="The sync protocol: the device sends a batch, the sheet checks three gates, writes row by row and replies, and the device merges; blocked or offline changes wait locally.">
<style>.fig{font-family:var(--font-body,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif)}
.fig .t{font-size:14px;font-weight:600;fill:var(--tx,#26232e)}
.fig .s{font-size:12px;fill:var(--tx-2,#6f687c)}
.fig .b rect{fill:color-mix(in srgb,var(--c) 11%,var(--bg,#fffcf7));stroke:var(--c);stroke-width:1}
.fig .lav{--c:var(--lav,#6d5ae6)}
.fig .mint{--c:var(--mint,#1d9e76)}
.fig .coral{--c:var(--coral,#d94f3b)}
.fig .plain rect{fill:var(--bg-soft,#f5f0e8);stroke:color-mix(in srgb,var(--tx-2,#6f687c) 40%,var(--bg,#fffcf7))}
.fig .a{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5}
.fig .f{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:.75;stroke-dasharray:4 4;opacity:.7}
.fig marker path{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="fig-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9"/></marker></defs>
<g class="b lav"><rect x="60" y="40" width="250" height="56" rx="8"/><text class="t" x="185" y="59" text-anchor="middle" dominant-baseline="central">Device: send a batch</text><text class="s" x="185" y="78" text-anchor="middle" dominant-baseline="central">Waits 2.5 s; beacon on leaving</text></g>
<line class="a" x1="312" y1="68" x2="366" y2="68" marker-end="url(#fig-arrow)"/>
<g class="b mint"><rect x="370" y="40" width="250" height="56" rx="8"/><text class="t" x="495" y="59" text-anchor="middle" dominant-baseline="central">Sheet: three gates</text><text class="s" x="495" y="78" text-anchor="middle" dominant-baseline="central">Secret, version, one at a time</text></g>
<line class="a" x1="185" y1="98" x2="185" y2="136" marker-end="url(#fig-arrow)"/>
<g class="b plain"><rect x="60" y="140" width="250" height="56" rx="8"/><text class="t" x="185" y="159" text-anchor="middle" dominant-baseline="central">Blocked or offline</text><text class="s" x="185" y="178" text-anchor="middle" dominant-baseline="central">Changes stay local, retried later</text></g>
<line class="a" x1="495" y1="98" x2="495" y2="136" marker-end="url(#fig-arrow)"/>
<g class="b mint"><rect x="370" y="140" width="250" height="56" rx="8"/><text class="t" x="495" y="159" text-anchor="middle" dominant-baseline="central">Write row by row</text><text class="s" x="495" y="178" text-anchor="middle" dominant-baseline="central">Later edit wins; deletes are logged</text></g>
<line class="a" x1="495" y1="198" x2="495" y2="236" marker-end="url(#fig-arrow)"/>
<g class="b mint"><rect x="370" y="240" width="250" height="56" rx="8"/><text class="t" x="495" y="259" text-anchor="middle" dominant-baseline="central">Reply</text><text class="s" x="495" y="278" text-anchor="middle" dominant-baseline="central">Only rows changed since last sync</text></g>
<line class="a" x1="368" y1="268" x2="314" y2="268" marker-end="url(#fig-arrow)"/>
<g class="b lav"><rect x="60" y="240" width="250" height="56" rx="8"/><text class="t" x="185" y="259" text-anchor="middle" dominant-baseline="central">Device: merge</text><text class="s" x="185" y="278" text-anchor="middle" dominant-baseline="central">Newer local rows are kept</text></g>
<g class="b plain"><rect x="60" y="340" width="560" height="76" rx="8"/><text class="t" x="340" y="360" text-anchor="middle" dominant-baseline="central">Fallbacks</text><text class="s" x="340" y="380" text-anchor="middle" dominant-baseline="central">13 days without syncing: the delete log may be pruned, so pull the whole sheet</text><text class="s" x="340" y="398" text-anchor="middle" dominant-baseline="central">Syncs again every 2 minutes, on return, and when back online; Reading rides along</text></g>
</svg>
