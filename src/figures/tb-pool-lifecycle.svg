<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 276" width="100%" role="img" aria-label="Life of a pool entry: it waits in the pool, gets picked for a day, and is retired once done; Later, Drop or deleting the task sends it back.">
<style>.fig{font-family:var(--font-body,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif)}
.fig .t{font-size:14px;font-weight:600;fill:var(--tx,#26232e)}
.fig .s{font-size:12px;fill:var(--tx-2,#6f687c)}
.fig .b rect{fill:color-mix(in srgb,var(--c) 11%,var(--bg,#fffcf7));stroke:var(--c);stroke-width:1}
.fig .lav{--c:var(--lav,#6d5ae6)}
.fig .mint{--c:var(--mint,#1d9e76)}
.fig .coral{--c:var(--coral,#d94f3b)}
.fig .plain rect{fill:var(--bg-soft,#f5f0e8);stroke:color-mix(in srgb,var(--tx-2,#6f687c) 40%,var(--bg,#fffcf7))}
.fig .a{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5}
.fig .f{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:.75;stroke-dasharray:4 4;opacity:.7}
.fig marker path{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="fig-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9"/></marker></defs>
<g class="b coral"><rect x="60" y="40" width="156" height="56" rx="8"/><text class="t" x="138" y="59" text-anchor="middle" dominant-baseline="central">In the pool</text><text class="s" x="138" y="78" text-anchor="middle" dominant-baseline="central">No date yet</text></g>
<line class="a" x1="218" y1="68" x2="258" y2="68" marker-end="url(#fig-arrow)"/>
<g class="b plain"><rect x="262" y="40" width="156" height="56" rx="8"/><text class="t" x="340" y="59" text-anchor="middle" dominant-baseline="central">Picked for a day</text><text class="s" x="340" y="78" text-anchor="middle" dominant-baseline="central">Crossed off the pool</text></g>
<line class="a" x1="420" y1="68" x2="460" y2="68" marker-end="url(#fig-arrow)"/>
<g class="b mint"><rect x="464" y="40" width="156" height="56" rx="8"/><text class="t" x="542" y="59" text-anchor="middle" dominant-baseline="central">Done</text><text class="s" x="542" y="78" text-anchor="middle" dominant-baseline="central">Entry is retired</text></g>
<path class="a" d="M340 98 L340 124 L138 124 L138 100" marker-end="url(#fig-arrow)"/>
<text class="s" x="239" y="142" text-anchor="middle" dominant-baseline="central">Later / Drop / task deleted: back to the pool</text>
<text class="s" x="40" y="182" text-anchor="start" dominant-baseline="central">Four pools, each with its own ending</text>
<g class="b coral"><rect x="40" y="198" width="135" height="56" rx="8"/><text class="t" x="107.5" y="217" text-anchor="middle" dominant-baseline="central">Ideas</text><text class="s" x="107.5" y="236" text-anchor="middle" dominant-baseline="central">Gone after a week</text></g>
<g class="b coral"><rect x="195" y="198" width="135" height="56" rx="8"/><text class="t" x="262.5" y="217" text-anchor="middle" dominant-baseline="central">Reading: Want</text><text class="s" x="262.5" y="236" text-anchor="middle" dominant-baseline="central">Asks: finished it?</text></g>
<g class="b coral"><rect x="350" y="198" width="135" height="56" rx="8"/><text class="t" x="417.5" y="217" text-anchor="middle" dominant-baseline="central">To try</text><text class="s" x="417.5" y="236" text-anchor="middle" dominant-baseline="central">Becomes a Box</text></g>
<g class="b coral"><rect x="505" y="198" width="135" height="56" rx="8"/><text class="t" x="572.5" y="217" text-anchor="middle" dominant-baseline="central">Task pool</text><text class="s" x="572.5" y="236" text-anchor="middle" dominant-baseline="central">Drag onto a day</text></g>
</svg>
