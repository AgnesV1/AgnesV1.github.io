<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 246" width="100%" role="img" aria-label="The reading module: things you want to read or watch are saved with a priority and a category, suggested when you add a task, asked about when the task is done, and logged under their own category once finished.">
<style>.fig{font-family:var(--font-body,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif)}
.fig .t{font-size:14px;font-weight:600;fill:var(--tx,#26232e)}
.fig .s{font-size:12px;fill:var(--tx-2,#6f687c)}
.fig .b rect{fill:color-mix(in srgb,var(--c) 11%,var(--bg,#fffcf7));stroke:var(--c);stroke-width:1}
.fig .lav{--c:var(--lav,#6d5ae6)}
.fig .mint{--c:var(--mint,#1d9e76)}
.fig .coral{--c:var(--coral,#d94f3b)}
.fig .plain rect{fill:var(--bg-soft,#f5f0e8);stroke:color-mix(in srgb,var(--tx-2,#6f687c) 40%,var(--bg,#fffcf7))}
.fig .a{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5}
.fig .f{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:.75;stroke-dasharray:4 4;opacity:.7}
.fig marker path{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="fig-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9"/></marker></defs>
<g class="b coral"><rect x="60" y="40" width="156" height="56" rx="8"/><text class="t" x="138" y="59" text-anchor="middle" dominant-baseline="central">Want</text><text class="s" x="138" y="78" text-anchor="middle" dominant-baseline="central">Priority and category</text></g>
<line class="a" x1="218" y1="68" x2="258" y2="68" marker-end="url(#fig-arrow)"/>
<g class="b plain"><rect x="262" y="40" width="156" height="56" rx="8"/><text class="t" x="340" y="59" text-anchor="middle" dominant-baseline="central">Picked for a day</text><text class="s" x="340" y="78" text-anchor="middle" dominant-baseline="central">Suggested for a task</text></g>
<line class="a" x1="420" y1="68" x2="460" y2="68" marker-end="url(#fig-arrow)"/>
<g class="b plain"><rect x="464" y="40" width="156" height="56" rx="8"/><text class="t" x="542" y="59" text-anchor="middle" dominant-baseline="central">Finished it?</text><text class="s" x="542" y="78" text-anchor="middle" dominant-baseline="central">Asked when it is done</text></g>
<line class="a" x1="542" y1="98" x2="542" y2="146" marker-end="url(#fig-arrow)"/>
<g class="b mint"><rect x="60" y="150" width="560" height="76" rx="8"/><text class="t" x="340" y="170" text-anchor="middle" dominant-baseline="central">Logged where it belongs</text><text class="s" x="340" y="190" text-anchor="middle" dominant-baseline="central">Under its own category, with the month and whether it was worth it</text><text class="s" x="340" y="208" text-anchor="middle" dominant-baseline="central">Books, shows, games, podcasts: everything finished goes on the record</text></g>
</svg>
