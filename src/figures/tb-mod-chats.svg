<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 216" width="100%" role="img" aria-label="The coffee chat module: a chat is booked as a task, notes record what was discussed and what the person is interested in, a dated next step keeps the follow-up, and later the notes help choose a gift that fits.">
<style>.fig{font-family:var(--font-body,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif)}
.fig .t{font-size:14px;font-weight:600;fill:var(--tx,#26232e)}
.fig .s{font-size:12px;fill:var(--tx-2,#6f687c)}
.fig .b rect{fill:color-mix(in srgb,var(--c) 11%,var(--bg,#fffcf7));stroke:var(--c);stroke-width:1}
.fig .lav{--c:var(--lav,#6d5ae6)}
.fig .mint{--c:var(--mint,#1d9e76)}
.fig .coral{--c:var(--coral,#d94f3b)}
.fig .plain rect{fill:var(--bg-soft,#f5f0e8);stroke:color-mix(in srgb,var(--tx-2,#6f687c) 40%,var(--bg,#fffcf7))}
.fig .a{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5}
.fig .f{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:.75;stroke-dasharray:4 4;opacity:.7}
.fig marker path{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="fig-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9"/></marker></defs>
<g class="b lav"><rect x="40" y="40" width="132" height="56" rx="8"/><text class="t" x="106" y="59" text-anchor="middle" dominant-baseline="central">Coffee chat</text><text class="s" x="106" y="78" text-anchor="middle" dominant-baseline="central">Booked as a task</text></g>
<line class="a" x1="174" y1="68" x2="192" y2="68" marker-end="url(#fig-arrow)"/>
<g class="b lav"><rect x="196" y="40" width="132" height="56" rx="8"/><text class="t" x="262" y="59" text-anchor="middle" dominant-baseline="central">Notes</text><text class="s" x="262" y="78" text-anchor="middle" dominant-baseline="central">Topics, interests</text></g>
<line class="a" x1="330" y1="68" x2="348" y2="68" marker-end="url(#fig-arrow)"/>
<g class="b lav"><rect x="352" y="40" width="132" height="56" rx="8"/><text class="t" x="418" y="59" text-anchor="middle" dominant-baseline="central">Next step</text><text class="s" x="418" y="78" text-anchor="middle" dominant-baseline="central">Follow-up, dated</text></g>
<line class="a" x1="486" y1="68" x2="504" y2="68" marker-end="url(#fig-arrow)"/>
<g class="b mint"><rect x="508" y="40" width="132" height="56" rx="8"/><text class="t" x="574" y="59" text-anchor="middle" dominant-baseline="central">Later</text><text class="s" x="574" y="78" text-anchor="middle" dominant-baseline="central">A gift that fits</text></g>
<line class="a" x1="340" y1="98" x2="340" y2="136" marker-end="url(#fig-arrow)"/>
<g class="b plain"><rect x="60" y="140" width="560" height="56" rx="8"/><text class="t" x="340" y="159" text-anchor="middle" dominant-baseline="central">What it is for</text><text class="s" x="340" y="178" text-anchor="middle" dominant-baseline="central">Remembering what someone cares about, so the next contact is about them</text></g>
</svg>
