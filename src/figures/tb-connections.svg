<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 462" width="100%" role="img" aria-label="How the parts of the tool connect: plans, ideas and the reading list feed a task; a task produces a coffee chat note, a dish to try and daily totals for the quarter sheet. Links are switched on per project, and some links are left out on purpose.">
<style>.fig{font-family:var(--font-body,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif)}
.fig .t{font-size:14px;font-weight:600;fill:var(--tx,#26232e)}
.fig .s{font-size:12px;fill:var(--tx-2,#6f687c)}
.fig .b rect{fill:color-mix(in srgb,var(--c) 11%,var(--bg,#fffcf7));stroke:var(--c);stroke-width:1}
.fig .lav{--c:var(--lav,#6d5ae6)}
.fig .mint{--c:var(--mint,#1d9e76)}
.fig .coral{--c:var(--coral,#d94f3b)}
.fig .plain rect{fill:var(--bg-soft,#f5f0e8);stroke:color-mix(in srgb,var(--tx-2,#6f687c) 40%,var(--bg,#fffcf7))}
.fig .a{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5}
.fig .f{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:.75;stroke-dasharray:4 4;opacity:.7}
.fig marker path{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="fig-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9"/></marker></defs>
<text class="s" x="138" y="22" text-anchor="middle" dominant-baseline="central">feeds a task</text>
<text class="s" x="542" y="22" text-anchor="middle" dominant-baseline="central">comes out of a task</text>
<g class="b lav"><rect x="60" y="40" width="156" height="56" rx="8"/><text class="t" x="138" y="59" text-anchor="middle" dominant-baseline="central">Plan</text><text class="s" x="138" y="78" text-anchor="middle" dominant-baseline="central">projectId, fixed ids</text></g>
<g class="b coral"><rect x="60" y="120" width="156" height="56" rx="8"/><text class="t" x="138" y="139" text-anchor="middle" dominant-baseline="central">Idea</text><text class="s" x="138" y="158" text-anchor="middle" dominant-baseline="central">Status from the task</text></g>
<g class="b coral"><rect x="60" y="200" width="156" height="56" rx="8"/><text class="t" x="138" y="219" text-anchor="middle" dominant-baseline="central">Reading: Want</text><text class="s" x="138" y="238" text-anchor="middle" dominant-baseline="central">Matched by title</text></g>
<g class="b plain"><rect x="262" y="120" width="156" height="56" rx="8"/><text class="t" x="340" y="139" text-anchor="middle" dominant-baseline="central">Task</text><text class="s" x="340" y="158" text-anchor="middle" dominant-baseline="central">The only hub</text></g>
<g class="b mint"><rect x="464" y="40" width="156" height="56" rx="8"/><text class="t" x="542" y="59" text-anchor="middle" dominant-baseline="central">Coffee chat note</text><text class="s" x="542" y="78" text-anchor="middle" dominant-baseline="central">id = mt: + task id</text></g>
<g class="b mint"><rect x="464" y="120" width="156" height="56" rx="8"/><text class="t" x="542" y="139" text-anchor="middle" dominant-baseline="central">Dish to try</text><text class="s" x="542" y="158" text-anchor="middle" dominant-baseline="central">From a finished task</text></g>
<g class="b mint"><rect x="464" y="200" width="156" height="56" rx="8"/><text class="t" x="542" y="219" text-anchor="middle" dominant-baseline="central">Quarter sheet</text><text class="s" x="542" y="238" text-anchor="middle" dominant-baseline="central">Daily totals only</text></g>
<path class="a" d="M218 68 L240 68 L240 136 L258 136" marker-end="url(#fig-arrow)"/>
<line class="a" x1="218" y1="148" x2="258" y2="148" marker-end="url(#fig-arrow)"/>
<path class="a" d="M218 228 L240 228 L240 160 L258 160" marker-end="url(#fig-arrow)"/>
<path class="a" d="M420 136 L442 136 L442 68 L460 68" marker-end="url(#fig-arrow)"/>
<line class="a" x1="420" y1="148" x2="460" y2="148" marker-end="url(#fig-arrow)"/>
<path class="a" d="M420 160 L442 160 L442 228 L460 228" marker-end="url(#fig-arrow)"/>
<g class="b plain"><rect x="60" y="290" width="560" height="76" rx="8"/><text class="t" x="340" y="310" text-anchor="middle" dominant-baseline="central">Wired by switches on the project, not by its name</text><text class="s" x="340" y="330" text-anchor="middle" dominant-baseline="central">progress · growth · pick people · pick ideas · what to watch</text><text class="s" x="340" y="348" text-anchor="middle" dominant-baseline="central">Rename a project and every link still holds</text></g>
<g class="b plain"><rect x="60" y="386" width="560" height="56" rx="8"/><text class="t" x="340" y="405" text-anchor="middle" dominant-baseline="central">Left unlinked on purpose</text><text class="s" x="340" y="424" text-anchor="middle" dominant-baseline="central">To try ✕ Ideas · people ✕ ideas · no planning on the phone</text></g>
</svg>
