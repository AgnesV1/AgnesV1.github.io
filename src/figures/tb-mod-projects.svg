<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 246" width="100%" role="img" aria-label="The projects module holds two kinds of thing. Goals need thinking and time and sit on a board that rolls forward by month, quarter and year. Ideas only need consuming and wait in a pool until picked for a day.">
<style>.fig{font-family:var(--font-body,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif)}
.fig .t{font-size:14px;font-weight:600;fill:var(--tx,#26232e)}
.fig .s{font-size:12px;fill:var(--tx-2,#6f687c)}
.fig .b rect{fill:color-mix(in srgb,var(--c) 11%,var(--bg,#fffcf7));stroke:var(--c);stroke-width:1}
.fig .lav{--c:var(--lav,#6d5ae6)}
.fig .mint{--c:var(--mint,#1d9e76)}
.fig .coral{--c:var(--coral,#d94f3b)}
.fig .plain rect{fill:var(--bg-soft,#f5f0e8);stroke:color-mix(in srgb,var(--tx-2,#6f687c) 40%,var(--bg,#fffcf7))}
.fig .a{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5}
.fig .f{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:.75;stroke-dasharray:4 4;opacity:.7}
.fig marker path{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="fig-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9"/></marker></defs>
<g class="b lav"><rect x="60" y="40" width="260" height="76" rx="8"/><text class="t" x="190" y="60" text-anchor="middle" dominant-baseline="central">Goals</text><text class="s" x="190" y="80" text-anchor="middle" dominant-baseline="central">Need thinking and time</text><text class="s" x="190" y="98" text-anchor="middle" dominant-baseline="central">Month, quarter, year, five years</text></g>
<g class="b coral"><rect x="360" y="40" width="260" height="76" rx="8"/><text class="t" x="490" y="60" text-anchor="middle" dominant-baseline="central">Ideas</text><text class="s" x="490" y="80" text-anchor="middle" dominant-baseline="central">Only need consuming</text><text class="s" x="490" y="98" text-anchor="middle" dominant-baseline="central">Outings and places to eat</text></g>
<line class="a" x1="190" y1="118" x2="190" y2="166" marker-end="url(#fig-arrow)"/>
<line class="a" x1="490" y1="118" x2="490" y2="166" marker-end="url(#fig-arrow)"/>
<g class="b plain"><rect x="60" y="170" width="260" height="56" rx="8"/><text class="t" x="190" y="189" text-anchor="middle" dominant-baseline="central">The board rolls</text><text class="s" x="190" y="208" text-anchor="middle" dominant-baseline="central">Late ones roll into now</text></g>
<g class="b plain"><rect x="360" y="170" width="260" height="56" rx="8"/><text class="t" x="490" y="189" text-anchor="middle" dominant-baseline="central">Picked into a day</text><text class="s" x="490" y="208" text-anchor="middle" dominant-baseline="central">Then gone once done</text></g>
</svg>
