<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 346" width="100%" role="img" aria-label="Four monitors over the same coded paragraphs: emotion, who it is aimed at, topics, and stance on events that recur. Each becomes one line per year, and the lines are read together.">
<style>.fig{font-family:var(--font-body,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif)}
.fig .t{font-size:14px;font-weight:600;fill:var(--tx,#26232e)}
.fig .s{font-size:12px;fill:var(--tx-2,#6f687c)}
.fig .b rect{fill:color-mix(in srgb,var(--c) 11%,var(--bg,#fffcf7));stroke:var(--c);stroke-width:1}
.fig .lav{--c:var(--lav,#6d5ae6)}
.fig .mint{--c:var(--mint,#1d9e76)}
.fig .coral{--c:var(--coral,#d94f3b)}
.fig .plain rect{fill:var(--bg-soft,#f5f0e8);stroke:color-mix(in srgb,var(--tx-2,#6f687c) 40%,var(--bg,#fffcf7))}
.fig .a{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5}
.fig .f{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:.75;stroke-dasharray:4 4;opacity:.7}
.fig marker path{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="fig-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9"/></marker></defs>
<g class="b lav"><rect x="40" y="40" width="132" height="56" rx="8"/><text class="t" x="106" y="59" text-anchor="middle" dominant-baseline="central">Emotion</text><text class="s" x="106" y="78" text-anchor="middle" dominant-baseline="central">Label and valence</text></g>
<g class="b lav"><rect x="196" y="40" width="132" height="56" rx="8"/><text class="t" x="262" y="59" text-anchor="middle" dominant-baseline="central">Targets</text><text class="s" x="262" y="78" text-anchor="middle" dominant-baseline="central">Aimed at whom</text></g>
<g class="b lav"><rect x="352" y="40" width="132" height="56" rx="8"/><text class="t" x="418" y="59" text-anchor="middle" dominant-baseline="central">Topics</text><text class="s" x="418" y="78" text-anchor="middle" dominant-baseline="central">Keyword shares</text></g>
<g class="b lav"><rect x="508" y="40" width="132" height="56" rx="8"/><text class="t" x="574" y="59" text-anchor="middle" dominant-baseline="central">Stance</text><text class="s" x="574" y="78" text-anchor="middle" dominant-baseline="central">On repeat events</text></g>
<line class="a" x1="106" y1="98" x2="106" y2="146" marker-end="url(#fig-arrow)"/>
<line class="a" x1="262" y1="98" x2="262" y2="146" marker-end="url(#fig-arrow)"/>
<line class="a" x1="418" y1="98" x2="418" y2="146" marker-end="url(#fig-arrow)"/>
<line class="a" x1="574" y1="98" x2="574" y2="146" marker-end="url(#fig-arrow)"/>
<g class="b mint"><rect x="60" y="150" width="560" height="76" rx="8"/><text class="t" x="340" y="170" text-anchor="middle" dominant-baseline="central">One line per monitor, one point per year</text><text class="s" x="340" y="190" text-anchor="middle" dominant-baseline="central">A shift is a line that moves: a feeling fades, a target changes, a topic drops out</text><text class="s" x="340" y="208" text-anchor="middle" dominant-baseline="central">Read them together: a change means more when two lines move in the same year</text></g>
<line class="a" x1="340" y1="228" x2="340" y2="266" marker-end="url(#fig-arrow)"/>
<g class="b plain"><rect x="60" y="270" width="560" height="56" rx="8"/><text class="t" x="340" y="289" text-anchor="middle" dominant-baseline="central">Stance needs its own pass</text><text class="s" x="340" y="308" text-anchor="middle" dominant-baseline="central">Tag recurring kinds of event and compare how each is written about across years</text></g>
</svg>
