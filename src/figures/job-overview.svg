<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 326" width="100%" role="img" aria-label="Overview of the job search method: resume library, application pipeline, interviews and offer, with a weekly and monthly review feeding back into the resume.">
<style>.fig{font-family:var(--font-body,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif)}
.fig .t{font-size:14px;font-weight:600;fill:var(--tx,#26232e)}
.fig .s{font-size:12px;fill:var(--tx-2,#6f687c)}
.fig .b rect{fill:color-mix(in srgb,var(--c) 11%,var(--bg,#fffcf7));stroke:var(--c);stroke-width:1}
.fig .lav{--c:var(--lav,#6d5ae6)}
.fig .mint{--c:var(--mint,#1d9e76)}
.fig .coral{--c:var(--coral,#d94f3b)}
.fig .plain rect{fill:var(--bg-soft,#f5f0e8);stroke:color-mix(in srgb,var(--tx-2,#6f687c) 40%,var(--bg,#fffcf7))}
.fig .a{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5}
.fig .f{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:.75;stroke-dasharray:4 4;opacity:.7}
.fig marker path{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="fig-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9"/></marker></defs>
<g class="b lav"><rect x="40" y="40" width="132" height="56" rx="8"/><text class="t" x="106" y="59" text-anchor="middle" dominant-baseline="central">Resume library</text><text class="s" x="106" y="78" text-anchor="middle" dominant-baseline="central">20–30 rewrites</text></g>
<line class="a" x1="174" y1="68" x2="192" y2="68" marker-end="url(#fig-arrow)"/>
<g class="b lav"><rect x="196" y="40" width="132" height="56" rx="8"/><text class="t" x="262" y="59" text-anchor="middle" dominant-baseline="central">Pipeline</text><text class="s" x="262" y="78" text-anchor="middle" dominant-baseline="central">Under 3 days old</text></g>
<line class="a" x1="330" y1="68" x2="348" y2="68" marker-end="url(#fig-arrow)"/>
<g class="b lav"><rect x="352" y="40" width="132" height="56" rx="8"/><text class="t" x="418" y="59" text-anchor="middle" dominant-baseline="central">Interviews</text><text class="s" x="418" y="78" text-anchor="middle" dominant-baseline="central">Round by round</text></g>
<line class="a" x1="486" y1="68" x2="504" y2="68" marker-end="url(#fig-arrow)"/>
<g class="b plain"><rect x="508" y="40" width="132" height="56" rx="8"/><text class="t" x="574" y="59" text-anchor="middle" dominant-baseline="central">Offer</text><text class="s" x="574" y="78" text-anchor="middle" dominant-baseline="central">On a tailwind</text></g>
<line class="a" x1="262" y1="98" x2="262" y2="146" marker-end="url(#fig-arrow)"/>
<line class="a" x1="418" y1="98" x2="418" y2="146" marker-end="url(#fig-arrow)"/>
<g class="b mint"><rect x="198" y="150" width="284" height="56" rx="8"/><text class="t" x="340" y="169" text-anchor="middle" dominant-baseline="central">Weekly and monthly review</text><text class="s" x="340" y="188" text-anchor="middle" dominant-baseline="central">Funnel · hours spent · debriefs</text></g>
<path class="a" d="M196 178 L106 178 L106 100" marker-end="url(#fig-arrow)"/>
<text class="s" x="44" y="224" text-anchor="start" dominant-baseline="central">back to the resume and the targeting</text>
<g class="b plain"><rect x="40" y="250" width="600" height="56" rx="8"/><text class="t" x="340" y="269" text-anchor="middle" dominant-baseline="central">Weekly rhythm</text><text class="s" x="340" y="288" text-anchor="middle" dominant-baseline="central">Applying is the main line · 2+ recorded mocks · 1+ coffee chat · thank-you within 24 h</text></g>
</svg>
