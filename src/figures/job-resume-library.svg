<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 226" width="100%" role="img" aria-label="Building the resume library: iterate per job description, expand, compress, and keep a long markdown master to cut from.">
<style>.fig{font-family:var(--font-body,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif)}
.fig .t{font-size:14px;font-weight:600;fill:var(--tx,#26232e)}
.fig .s{font-size:12px;fill:var(--tx-2,#6f687c)}
.fig .b rect{fill:color-mix(in srgb,var(--c) 11%,var(--bg,#fffcf7));stroke:var(--c);stroke-width:1}
.fig .lav{--c:var(--lav,#6d5ae6)}
.fig .mint{--c:var(--mint,#1d9e76)}
.fig .coral{--c:var(--coral,#d94f3b)}
.fig .plain rect{fill:var(--bg-soft,#f5f0e8);stroke:color-mix(in srgb,var(--tx-2,#6f687c) 40%,var(--bg,#fffcf7))}
.fig .a{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5}
.fig .f{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:.75;stroke-dasharray:4 4;opacity:.7}
.fig marker path{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="fig-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9"/></marker></defs>
<g class="b lav"><rect x="60" y="40" width="156" height="56" rx="8"/><text class="t" x="138" y="59" text-anchor="middle" dominant-baseline="central">Iterate</text><text class="s" x="138" y="78" text-anchor="middle" dominant-baseline="central">A new pass per JD</text></g>
<line class="a" x1="218" y1="68" x2="258" y2="68" marker-end="url(#fig-arrow)"/>
<g class="b lav"><rect x="262" y="40" width="156" height="56" rx="8"/><text class="t" x="340" y="59" text-anchor="middle" dominant-baseline="central">Expand</text><text class="s" x="340" y="78" text-anchor="middle" dominant-baseline="central">A bullet per JD duty</text></g>
<line class="a" x1="420" y1="68" x2="460" y2="68" marker-end="url(#fig-arrow)"/>
<g class="b lav"><rect x="464" y="40" width="156" height="56" rx="8"/><text class="t" x="542" y="59" text-anchor="middle" dominant-baseline="central">Compress</text><text class="s" x="542" y="78" text-anchor="middle" dominant-baseline="central">Story, then relevance</text></g>
<line class="a" x1="340" y1="98" x2="340" y2="146" marker-end="url(#fig-arrow)"/>
<g class="b mint"><rect x="60" y="150" width="560" height="56" rx="8"/><text class="t" x="340" y="169" text-anchor="middle" dominant-baseline="central">Resume library (markdown)</text><text class="s" x="340" y="188" text-anchor="middle" dominant-baseline="central">1.5–2× the target length, cut down for each application</text></g>
</svg>
