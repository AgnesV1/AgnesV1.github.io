<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 636" width="100%" role="img" aria-label="Four interview rounds drawing on a library of twelve stories, with what to prepare or what is being tested at each round, and a written debrief after each one.">
<style>.fig{font-family:var(--font-body,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif)}
.fig .t{font-size:14px;font-weight:600;fill:var(--tx,#26232e)}
.fig .s{font-size:12px;fill:var(--tx-2,#6f687c)}
.fig .b rect{fill:color-mix(in srgb,var(--c) 11%,var(--bg,#fffcf7));stroke:var(--c);stroke-width:1}
.fig .lav{--c:var(--lav,#6d5ae6)}
.fig .mint{--c:var(--mint,#1d9e76)}
.fig .coral{--c:var(--coral,#d94f3b)}
.fig .plain rect{fill:var(--bg-soft,#f5f0e8);stroke:color-mix(in srgb,var(--tx-2,#6f687c) 40%,var(--bg,#fffcf7))}
.fig .a{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5}
.fig .f{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:.75;stroke-dasharray:4 4;opacity:.7}
.fig marker path{fill:none;stroke:var(--tx-2,#6f687c);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style>
<defs><marker id="fig-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9"/></marker></defs>
<g class="b lav"><rect x="60" y="40" width="560" height="56" rx="8"/><text class="t" x="340" y="59" text-anchor="middle" dominant-baseline="central">A library of twelve stories</text><text class="s" x="340" y="78" text-anchor="middle" dominant-baseline="central">Tell each story from what they need, in their own vocabulary</text></g>
<line class="a" x1="185" y1="98" x2="185" y2="136" marker-end="url(#fig-arrow)"/>
<g class="b lav"><rect x="60" y="140" width="250" height="56" rx="8"/><text class="t" x="185" y="159" text-anchor="middle" dominant-baseline="central">Round 1 · HR call</text><text class="s" x="185" y="178" text-anchor="middle" dominant-baseline="central">Same stories, new angles</text></g>
<line class="a" x1="312" y1="168" x2="366" y2="168" marker-end="url(#fig-arrow)"/>
<g class="b plain"><rect x="370" y="140" width="250" height="56" rx="8"/><text class="t" x="495" y="159" text-anchor="middle" dominant-baseline="central">Closing questions</text><text class="s" x="495" y="178" text-anchor="middle" dominant-baseline="central">Timeline, team, who they want</text></g>
<line class="a" x1="185" y1="198" x2="185" y2="236" marker-end="url(#fig-arrow)"/>
<g class="b lav"><rect x="60" y="240" width="250" height="56" rx="8"/><text class="t" x="185" y="259" text-anchor="middle" dominant-baseline="central">Round 2 · HM + tech</text><text class="s" x="185" y="278" text-anchor="middle" dominant-baseline="central">Iterate on round 1</text></g>
<line class="a" x1="312" y1="268" x2="366" y2="268" marker-end="url(#fig-arrow)"/>
<g class="b plain"><rect x="370" y="240" width="250" height="56" rx="8"/><text class="t" x="495" y="259" text-anchor="middle" dominant-baseline="central">Prepare</text><text class="s" x="495" y="278" text-anchor="middle" dominant-baseline="central">Peer mock, teamwork Q&amp;A, drills</text></g>
<line class="a" x1="185" y1="298" x2="185" y2="336" marker-end="url(#fig-arrow)"/>
<g class="b lav"><rect x="60" y="340" width="250" height="56" rx="8"/><text class="t" x="185" y="359" text-anchor="middle" dominant-baseline="central">Round 3 · skip-level + HM</text><text class="s" x="185" y="378" text-anchor="middle" dominant-baseline="central">Strategy, then the details</text></g>
<line class="a" x1="312" y1="368" x2="366" y2="368" marker-end="url(#fig-arrow)"/>
<g class="b plain"><rect x="370" y="340" width="250" height="56" rx="8"/><text class="t" x="495" y="359" text-anchor="middle" dominant-baseline="central">What they test</text><text class="s" x="495" y="378" text-anchor="middle" dominant-baseline="central">Depth of thinking, real execution</text></g>
<line class="a" x1="185" y1="398" x2="185" y2="436" marker-end="url(#fig-arrow)"/>
<g class="b lav"><rect x="60" y="440" width="250" height="56" rx="8"/><text class="t" x="185" y="459" text-anchor="middle" dominant-baseline="central">Round 4 · it depends</text><text class="s" x="185" y="478" text-anchor="middle" dominant-baseline="central">Team dinner, case, or the CEO</text></g>
<line class="a" x1="312" y1="468" x2="366" y2="468" marker-end="url(#fig-arrow)"/>
<g class="b plain"><rect x="370" y="440" width="250" height="56" rx="8"/><text class="t" x="495" y="459" text-anchor="middle" dominant-baseline="central">What they test</text><text class="s" x="495" y="478" text-anchor="middle" dominant-baseline="central">Personality and authenticity</text></g>
<line class="a" x1="185" y1="498" x2="185" y2="536" marker-end="url(#fig-arrow)"/>
<g class="b mint"><rect x="60" y="540" width="560" height="76" rx="8"/><text class="t" x="340" y="560" text-anchor="middle" dominant-baseline="central">Debrief right after</text><text class="s" x="340" y="580" text-anchor="middle" dominant-baseline="central">Write down every question and answer, then work out how to close each gap</text><text class="s" x="340" y="598" text-anchor="middle" dominant-baseline="central">Record your own mock sessions and replay them for pronunciation</text></g>
</svg>
